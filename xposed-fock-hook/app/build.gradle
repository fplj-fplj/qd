plugins {
    id 'com.android.application'
}

android {
    namespace 'com.qidian.fockhook'
    compileSdk 34

    defaultConfig {
        applicationId "com.qidian.fockhook"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Xposed/LSPosed API：如果你的框架是 API 102，改成对应版本即可
    compileOnly 'de.robv.android.xposed:api:82'
}
